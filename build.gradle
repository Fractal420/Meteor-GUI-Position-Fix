tasks.register("buildAll") {
    group = "build"
    description = "Build the mod for every supported Minecraft version"
    dependsOn(":1.21.11:build", ":26.1:build", ":26.2:build")
}

def selected = findProperty("mc") ?: findProperty("minecraft_version")

if (selected != null) {
    def targetPath = ":${selected}"
    tasks.register("build") {
        group = "build"
        description = "Build the selected Minecraft version (${selected})"
        dependsOn("${targetPath}:build")
        doLast {
            copy {
                from project(targetPath).layout.buildDirectory.dir("libs")
                into layout.buildDirectory.dir("libs")
                include "*.jar"
            }
            logger.lifecycle("Built jars for ${selected} are in build/libs/ and versions/${selected}/build/libs/")
        }
    }
} else {
    tasks.register("build") {
        group = "build"
        description = "Print build help (no -Pmc given)"
        doLast {
            logger.lifecycle("""
No Minecraft version selected.

Usage examples:
  ./gradlew build -Pmc=1.21.11
  ./gradlew build -Pmc=26.1
  ./gradlew build -Pmc=26.2
  ./gradlew :1.21.11:build
  ./gradlew :26.1:build
  ./gradlew :26.2:build
  ./gradlew buildAll
""")
        }
    }
}
